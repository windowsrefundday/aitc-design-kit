<!--
  AITC badge v1 — circular pfp badge, brand-aligned redesign.

  Decisions (per Joel):
  - disc: forest-deep #0c2719 (spec black, not void black)
  - ring + arc text: all cream, hairline ring
  - wording/case identical to current pfp: AI TECHNOLOGY / INNOVATION CLUB, uppercase
  - type: brand stack (SF Pro Display -> Inter Tight fallback), wide-tracked
  - mark: logo-refined.svg paths (ids preserved), cream A/slash/T, forest C
  - gold kept as the single accent: T/A stem (path i) only
  - simplified: no stars, no gold arc sliver
  - gold value ~#d9a13b is an eyeball match to the pfp, not a token

  Fixed-color master (like the pfp): do NOT use as a CSS mask.
  For a maskable mark use logo-mark-bare.svg (single-colour version).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="aitc-badge-title">
  <title id="aitc-badge-title">AITC badge — AI Technology Innovation Club</title>
  <defs>
    <!-- top arc: left point to right point over the crown -->
    <path id="arc-top" d="M 126,409 A 400,400 0 0 1 898,409" fill="none"/>
    <!-- bottom arc: left point to right point under the base (glyphs stay upright) -->
    <path id="arc-bottom" d="M 126,615 A 400,400 0 0 0 898,615" fill="none"/>
  </defs>

  <rect width="1024" height="1024" fill="#0c2719"/>
  <circle cx="512" cy="512" r="478" fill="none" stroke="#fff3cb" stroke-width="3"/>

  <text font-family="'SF Pro Display', 'Inter Tight', 'Helvetica Neue', sans-serif"
        font-size="76" font-weight="600" letter-spacing="14" fill="#fff3cb">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">AI TECHNOLOGY</textPath>
  </text>
  <text font-family="'SF Pro Display', 'Inter Tight', 'Helvetica Neue', sans-serif"
        font-size="76" font-weight="600" letter-spacing="14" fill="#fff3cb">
    <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">INNOVATION CLUB</textPath>
  </text>

